<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Avengers Character Search</h1>
        <p>Enter a superhero's name or alias, or leave the field blank to see the full list.</p>
        
        <form id="search-form">
            <label for="query">Superhero name or alias:</label>
            <input type="text" name="query" id="query" placeholder="e.g. Thor">
            <button type="submit">Search</button>
        </form>
        
        <div id="result"></div>
    </main>
    
</body>
</html>
